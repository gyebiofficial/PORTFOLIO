<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected flyer and visual design projects by Prince Gyebi Adusei.">
    <title>Projects | Prince Gyebi Adusei</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="CV.html">Prince Gyebi Adusei</a>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="About.html">About</a></li>
                <li><a href="Skills.html">Skills</a></li>
                <li><a class="nav-current" href="Project.html" aria-current="page">Projects</a></li>
                <li><a class="nav-cta" href="Contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="projects-hero" aria-labelledby="projects-heading">
            <div class="eyebrow">Selected work <span aria-hidden="true">✦</span></div>
            <h1 id="projects-heading">Ideas made <em>visual.</em></h1>
            <p class="projects-intro">
                A collection of flyer designs created for businesses, celebrations, and
                brands that want to make a memorable first impression.
            </p>
        </section>

        <section class="project-gallery" aria-label="Flyer design projects">
            <article class="project-card project-card-featured">
                <button class="flyer-card" type="button"
                        data-src="ASSETS/frimpy.jpg"
                        data-title="Kente Business"
                        data-description="A bold promotional flyer for a contemporary kente brand.">
                    <span class="card-image">
                        <img src="ASSETS/frimpy.jpg" alt="Kente Business flyer" loading="lazy">
                        <span class="view-project">View design <span aria-hidden="true">↗</span></span>
                    </span>
                    <span class="card-content">
                        <span class="card-number">01</span>
                        <span class="flyer-title">Kente Business</span>
                        <span class="card-meta">Brand promotion · Print</span>
                    </span>
                </button>
            </article>

            <article class="project-card">
                <button class="flyer-card" type="button"
                        data-src="ASSETS/Lizzy%20Perfume.jpg"
                        data-title="Perfume Business"
                        data-description="An elegant product-led composition for a perfume collection.">
                    <span class="card-image">
                        <img src="ASSETS/Lizzy%20Perfume.jpg" alt="Perfume Business flyer" loading="lazy">
                        <span class="view-project">View design <span aria-hidden="true">↗</span></span>
                    </span>
                    <span class="card-content">
                        <span class="card-number">02</span>
                        <span class="flyer-title">Perfume Business</span>
                        <span class="card-meta">Product design · Print</span>
                    </span>
                </button>
            </article>

            <article class="project-card">
                <button class="flyer-card" type="button"
                        data-src="ASSETS/NANCY.jpg"
                        data-title="Bakery Business"
                        data-description="A warm, inviting promotional piece for a local bakery.">
                    <span class="card-image">
                        <img src="ASSETS/NANCY.jpg" alt="Bakery Business flyer" loading="lazy">
                        <span class="view-project">View design <span aria-hidden="true">↗</span></span>
                    </span>
                    <span class="card-content">
                        <span class="card-number">03</span>
                        <span class="flyer-title">Bakery Business</span>
                        <span class="card-meta">Food &amp; beverage · Print</span>
                    </span>
                </button>
            </article>

            <article class="project-card project-card-wide">
                <button class="flyer-card" type="button"
                        data-src="ASSETS/REPUBLIC%20DAY.jpg"
                        data-title="Republic Day"
                        data-description="A celebratory social graphic with vibrant, energetic colour.">
                    <span class="card-image">
                        <img src="ASSETS/REPUBLIC%20DAY.jpg" alt="Republic Day flyer" loading="lazy">
                        <span class="view-project">View design <span aria-hidden="true">↗</span></span>
                    </span>
                    <span class="card-content">
                        <span class="card-number">04</span>
                        <span class="flyer-title">Republic Day</span>
                        <span class="card-meta">Campaign design · Social</span>
                    </span>
                </button>
            </article>

            <article class="project-card">
                <button class="flyer-card" type="button"
                        data-src="ASSETS/Hilda%20Sash%202.jpg"
                        data-title="Sash Business"
                        data-description="A warm, elegant promotional piece for a sash business, showcasing beautiful custom sashes for graduations, birthdays, pageants, and special occasions.">
                    <span class="card-image">
                        <img src="ASSETS/Hilda%20Sash%202.jpg" alt="Sash Business flyer" loading="lazy">
                        <span class="view-project">View design <span aria-hidden="true">↗</span></span>
                    </span>
                    <span class="card-content">
                        <span class="card-number">05</span>
                        <span class="flyer-title">Sash Business</span>
                        <span class="card-meta">Clothing &amp; accessories · Print</span>
                    </span>
                </button>
            </article>

            <article class="project-card">
                <button class="flyer-card" type="button"
                        data-src="ASSETS/EID%20ADHA.jpg"
                        data-title="Eid Adha"
                        data-description="A festive, eye-catching design created for Eid Adha celebrations.">
                    <span class="card-image">
                        <img src="ASSETS/EID%20ADHA.jpg" alt="Eid Adha flyer" loading="lazy">
                        <span class="view-project">View design <span aria-hidden="true">↗</span></span>
                    </span>
                    <span class="card-content">
                        <span class="card-number">06</span>
                        <span class="flyer-title">Eid Adha</span>
                        <span class="card-meta">Celebration · Print</span>
                    </span>
                </button>
            </article>

        </section>
    </main>

    <dialog class="project-dialog" aria-labelledby="dialog-title">
        <button class="dialog-close" type="button" aria-label="Close project preview">&times;</button>
        <div class="dialog-image-wrap">
            <img class="dialog-image" src="" alt="">
        </div>
        <div class="dialog-copy">
            <p class="eyebrow">Project preview</p>
            <h2 id="dialog-title"></h2>
            <p class="dialog-description"></p>
        </div>
    </dialog>

    <footer class="site-footer">
        <p>&copy; 2026 Personal Portfolio</p>
    </footer>

    <script>
        const dialog = document.querySelector(".project-dialog");
        const dialogImage = document.querySelector(".dialog-image");
        const dialogTitle = document.querySelector("#dialog-title");
        const dialogDescription = document.querySelector(".dialog-description");

        document.querySelectorAll(".flyer-card").forEach((card) => {
            card.addEventListener("click", () => {
                dialogImage.src = card.dataset.src;
                dialogImage.alt = `${card.dataset.title} flyer preview`;
                dialogTitle.textContent = card.dataset.title;
                dialogDescription.textContent = card.dataset.description;
                dialog.showModal();
            });
        });

        document.querySelector(".dialog-close").addEventListener("click", () => dialog.close());
        dialog.addEventListener("click", (event) => {
            if (event.target === dialog) dialog.close();
        });
    </script>
</body>
</html>
